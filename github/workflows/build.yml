name: Build Geode Mod
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android64
      - uses: actions/upload-artifact@v3
        with:
          name: my-mod
          path: ${{ steps.build.outputs.build-output }}
